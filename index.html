<!DOCTYPE html>
<html lang="ru" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Трекер Контента</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    transitionProperty: { 'height': 'height', 'spacing': 'margin, padding' },
                    colors: {
                        ytGreen: '#86b32d',
                        ytGreenHover: '#98c835'
                    },
                    maxWidth: {
                        '8xl': '1600px'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
        .card-transition { transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out, border-color 0.2s; }
        .card-transition:hover { transform: translateY(-5px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: flex !important; }
        body.is-admin .admin-only.block-element { display: block !important; }
        body.is-admin .admin-only.inline-block-element { display: inline-block !important; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        body.modal-open { overflow: hidden; }
        
        /* Вкладки в стиле референса */
        .tab-btn { border-bottom: 2px solid transparent; }
        .tab-btn.active { color: #86b32d; border-bottom-color: #86b32d; }
        
        /* Радио-кнопки категорий Ютуба */
        .category-radio:checked + div { background-color: #374151; color: white; border-color: #4b5563; }
        .dark .category-radio:checked + div { background-color: #4b5563; color: white; border-color: #6b7280; }
        
        .priority-star.active { color: #eab308; } /* Yellow for active star */
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-[#1a1c1e] dark:text-gray-100 pb-10 min-h-screen">

<!-- ГЛАВНАЯ ВЕРХНЯЯ ПАНЕЛЬ (Header) -->
<header class="bg-white dark:bg-[#222426] border-b border-gray-200 dark:border-gray-800 sticky top-0 z-40 shadow-sm">
    <div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8 h-auto sm:h-16 flex flex-col sm:flex-row items-center justify-between gap-4 py-3 sm:py-0">
        
        <!-- Логотип и Вкладки -->
        <div class="flex items-center gap-6 w-full sm:w-auto overflow-x-auto hide-scrollbar shrink-0">
            <div class="flex items-center gap-2 font-black text-xl tracking-tight text-gray-900 dark:text-white shrink-0">
                <i class="ph-fill ph-popcorn text-ytGreen text-2xl"></i>
                Трекер
            </div>
            
            <div class="flex gap-4 font-bold text-sm text-gray-500 dark:text-gray-400 h-full pt-1 shrink-0">
                <button onclick="switchTab('main')" id="tabMain" class="tab-btn active hover:text-gray-800 dark:hover:text-gray-200 transition-colors pb-3 sm:pb-0 h-full flex items-center gap-1.5">
                    Кино / Игры
                </button>
                <button onclick="switchTab('youtube')" id="tabYoutube" class="tab-btn hover:text-gray-800 dark:hover:text-gray-200 transition-colors pb-3 sm:pb-0 h-full flex items-center gap-1.5">
                    Видосы
                </button>
            </div>
        </div>

        <!-- Центральный поиск -->
        <div class="w-full max-w-2xl relative flex-shrink">
            <i class="ph-bold ph-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="globalSearchInput" placeholder="Поиск..." class="w-full pl-11 pr-4 py-2.5 bg-gray-100 dark:bg-[#151718] border border-transparent focus:border-gray-300 dark:focus:border-gray-700 rounded-xl focus:ring-0 dark:text-white outline-none transition-all text-sm font-medium placeholder-gray-500">
        </div>

        <!-- Иконки и Кнопки действий -->
        <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end shrink-0">
            <div class="flex items-center gap-2 text-gray-400">
                <div id="socialLinksContainer" class="flex items-center gap-1"></div>
                <button onclick="toggleTheme()" class="p-2 hover:text-yellow-500 transition-colors rounded-lg" title="Переключить тему"><i id="themeIcon" class="ph-fill ph-moon text-lg"></i></button>
                <button onclick="openPasswordModal()" id="loginBtn" class="p-2 hover:text-indigo-500 transition-colors rounded-lg" title="Вход"><i class="ph-fill ph-lock-key text-lg"></i></button>
                <button onclick="openSettingsModal()" class="admin-only p-2 hover:text-white transition-colors rounded-lg"><i class="ph-fill ph-gear text-lg"></i></button>
                <button onclick="logout()" id="logoutBtn" class="admin-only p-2 hover:text-red-500 transition-colors rounded-lg"><i class="ph-fill ph-sign-out text-lg"></i></button>
            </div>

            <div class="admin-only flex items-center gap-2">
                <button onclick="openModal()" id="mainAddBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md transition-colors whitespace-nowrap">
                    Новая запись
                </button>
                <button onclick="openYoutubeModal()" id="ytAddBtn" class="hidden bg-ytGreen hover:bg-ytGreenHover text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md transition-colors whitespace-nowrap uppercase tracking-wider flex items-center gap-1">
                    Предложить видео <i class="ph-fill ph-caret-right text-lg"></i>
                </button>
            </div>
        </div>

    </div>
</header>

<div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- РАЗДЕЛ КИНО И ИГР -->
    <div id="mainContainer">
        <!-- Фильтры -->
        <div class="flex flex-col xl:flex-row gap-4 justify-between items-start xl:items-center mb-6">
            <div class="flex gap-2 overflow-x-auto hide-scrollbar w-full xl:w-auto pb-1">
                <button onclick="setFilter('type', 'all')" class="filter-btn type-filter active px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300" data-value="all">Все форматы</button>
                <button onclick="setFilter('type', 'movie')" class="filter-btn type-filter px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 dark:bg-[#222426] dark:border-gray-800 dark:text-gray-300 dark:hover:bg-[#2a2c2f]" data-value="movie">Фильмы</button>
                <button onclick="setFilter('type', 'series')" class="filter-btn type-filter px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 dark:bg-[#222426] dark:border-gray-800 dark:text-gray-300 dark:hover:bg-[#2a2c2f]" data-value="series">Сериалы</button>
                <button onclick="setFilter('type', 'cartoon')" class="filter-btn type-filter px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 dark:bg-[#222426] dark:border-gray-800 dark:text-gray-300 dark:hover:bg-[#2a2c2f]" data-value="cartoon">Мультфильмы</button>
                <button onclick="setFilter('type', 'game')" class="filter-btn type-filter px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 dark:bg-[#222426] dark:border-gray-800 dark:text-gray-300 dark:hover:bg-[#2a2c2f]" data-value="game">Игры</button>
            </div>

            <div class="flex gap-2 overflow-x-auto hide-scrollbar w-full xl:w-auto pb-1 items-center">
                <button onclick="toggleBestFilter()" id="btnBest" class="flex items-center gap-1.5 px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all text-yellow-600 bg-yellow-50 border border-yellow-200 hover:bg-yellow-100 dark:bg-[#222426] dark:border-yellow-700/30 dark:text-yellow-500 whitespace-nowrap">
                    <i class="ph-fill ph-star"></i> Лучшее
                </button>
                <div class="w-px h-6 bg-gray-300 dark:bg-gray-700 mx-1"></div>
                <button onclick="setFilter('status', 'all')" class="filter-btn status-filter active px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300" data-value="all">Любой статус</button>
                <button onclick="setFilter('status', 'watched')" class="filter-btn status-filter px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 dark:bg-[#222426] dark:border-gray-800 dark:text-gray-300 dark:hover:bg-[#2a2c2f]" data-value="watched">Пройдено</button>
                <button onclick="setFilter('status', 'planning')" class="filter-btn status-filter px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 dark:bg-[#222426] dark:border-gray-800 dark:text-gray-300 dark:hover:bg-[#2a2c2f]" data-value="planning">В планах</button>
                <button onclick="toggleAdvancedFilters()" class="ml-auto flex items-center justify-center p-2 rounded-xl font-medium text-sm transition-all text-gray-600 bg-white border border-gray-200 hover:bg-gray-50 dark:bg-[#222426] dark:border-gray-800 dark:text-gray-300 dark:hover:bg-[#2a2c2f]">
                    <i class="ph-bold ph-sliders-horizontal text-lg"></i>
                </button>
            </div>
        </div>

        <div id="advancedFilters" class="hidden grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6 p-4 bg-white dark:bg-[#222426] border border-gray-200 dark:border-gray-800 rounded-2xl">
            <div>
                <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 ml-1">Жанр</label>
                <select id="filterGenre" class="w-full px-4 py-2 bg-gray-50 dark:bg-[#151718] border border-gray-200 dark:border-gray-700 rounded-xl text-sm font-medium dark:text-white focus:ring-1 focus:ring-indigo-500 outline-none appearance-none cursor-pointer"></select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 ml-1">Режиссер / Студия</label>
                <input type="text" id="filterDirector" placeholder="Любой..." class="w-full px-4 py-2 bg-gray-50 dark:bg-[#151718] border border-gray-200 dark:border-gray-700 rounded-xl text-sm font-medium dark:text-white focus:ring-1 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 ml-1">Год</label>
                <input type="number" id="filterYear" placeholder="Например: 2023" class="w-full px-4 py-2 bg-gray-50 dark:bg-[#151718] border border-gray-200 dark:border-gray-700 rounded-xl text-sm font-medium dark:text-white focus:ring-1 focus:ring-indigo-500 outline-none">
            </div>
        </div>

        <div id="contentGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4 sm:gap-6 scroll-mt-24">
            <!-- Карточки -->
        </div>

        <!-- Пагинация Кино/Игр -->
        <div id="paginationControls" class="hidden flex-wrap justify-center items-center gap-3 mt-8 pb-4">
            <button id="prevPageBtn" onclick="changePage(-1)" class="px-4 py-2 bg-white dark:bg-[#222426] rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 disabled:opacity-40 font-bold text-sm hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors flex items-center gap-2">
                <i class="ph-bold ph-caret-left"></i> Назад
            </button>
            <span id="pageInfo" class="text-sm font-bold text-gray-600 dark:text-gray-400 bg-gray-100 dark:bg-[#151718] px-4 py-2 rounded-xl hidden sm:block">Стр 1 / 1</span>
            <div class="flex items-center gap-1.5 bg-white dark:bg-[#222426] px-3 py-1.5 rounded-xl border border-gray-200 dark:border-gray-800">
                <span class="text-sm font-bold text-gray-400">Стр:</span>
                <input type="number" id="pageJumpInput" min="1" class="w-12 bg-transparent text-center text-sm font-bold dark:text-white outline-none">
                <button onclick="jumpToPage()" class="text-gray-400 hover:text-indigo-500"><i class="ph-bold ph-arrow-right"></i></button>
            </div>
            <button id="nextPageBtn" onclick="changePage(1)" class="px-4 py-2 bg-white dark:bg-[#222426] rounded-xl shadow-sm border border-gray-200 dark:border-gray-800 disabled:opacity-40 font-bold text-sm hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors flex items-center gap-2">
                Вперед <i class="ph-bold ph-caret-right"></i>
            </button>
        </div>
    </div>

    <!-- РАЗДЕЛ YOUTUBE -->
    <div id="youtubeContainer" class="hidden">
        
        <!-- Категории Ютуба (Фильтры с подсчетом) -->
        <div class="flex gap-2 overflow-x-auto hide-scrollbar mb-6 pb-2" id="ytFiltersContainer">
            <!-- Сюда вставятся кнопки фильтров -->
        </div>

        <div id="youtubeGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6">
            <!-- Карточки Ютуб -->
        </div>
        
        <div id="youtubeEmptyState" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <i class="ph-fill ph-youtube-logo text-6xl text-gray-300 dark:text-gray-700 mb-4"></i>
            <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">Нет предложенных видео</h3>
            <p class="text-gray-500 dark:text-gray-400 text-sm font-medium">Добавьте ролик, который хотите посмотреть.</p>
        </div>
    </div>

    <!-- ГЛОБАЛЬНЫЙ ПУСТОЙ ЭКРАН -->
    <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-center">
        <i class="ph-fill ph-ghost text-6xl text-gray-300 dark:text-gray-700 mb-4"></i>
        <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">Ничего не найдено</h3>
        <p class="text-gray-500 dark:text-gray-400 text-sm font-medium">Попробуйте изменить фильтры.</p>
    </div>
</div>

<!-- Модальное окно просмотра (КИНО/ИГРЫ) -->
<div id="viewModal" class="fixed inset-0 bg-gray-900/95 hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300 backdrop-blur-sm" onclick="closeViewModal(event)">
    <div class="bg-white dark:bg-[#1e1f22] rounded-3xl shadow-2xl w-full max-w-5xl overflow-hidden transform scale-95 transition-transform duration-300 relative flex flex-col md:flex-row max-h-[90vh] border border-gray-200 dark:border-gray-800" onclick="event.stopPropagation()">
        
        <button onclick="closeViewModal()" class="absolute top-4 right-4 bg-gray-200/80 dark:bg-black/50 text-gray-800 dark:text-white hover:bg-gray-300 dark:hover:bg-black/70 p-2.5 rounded-full transition-colors z-40 backdrop-blur-md shadow-lg border border-white/10">
            <i class="ph-bold ph-x text-lg"></i>
        </button>

        <div class="md:w-2/5 relative bg-gray-100 dark:bg-black flex-shrink-0 flex items-center justify-center overflow-hidden border-b md:border-b-0 md:border-r border-gray-200 dark:border-gray-800 p-6">
            <div id="viewFallback" class="absolute inset-0 flex items-center justify-center p-6 text-center z-0">
                 <span id="viewFallbackText" class="text-xl font-black text-gray-400 dark:text-gray-700 uppercase tracking-widest break-words w-full line-clamp-4"></span>
            </div>
            <img id="viewPoster" src="" class="relative w-full h-64 sm:h-80 md:h-auto max-h-[75vh] object-contain z-20 drop-shadow-2xl rounded-xl" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">
            <div id="viewRatingBadge" class="absolute bottom-6 left-6 flex items-center gap-1.5 text-2xl font-black text-yellow-400 bg-gray-900/90 px-4 py-1.5 rounded-xl backdrop-blur-md hidden shadow-2xl border border-yellow-500/30 z-30">
                <i class="ph-fill ph-star"></i><span id="viewRating"></span>
            </div>
        </div>

        <div class="p-6 md:p-10 flex flex-col flex-grow overflow-y-auto hide-scrollbar bg-white dark:bg-[#1e1f22] relative">
            <div class="flex items-center gap-2 mb-4 flex-wrap">
                <span id="viewType" class="inline-flex items-center gap-1 px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider"></span>
                <span id="viewStatus" class="inline-flex items-center gap-1 px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider"></span>
                <span id="viewIsTopBadge" class="text-yellow-700 bg-yellow-100 dark:bg-yellow-900/30 dark:text-yellow-400 px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider hidden border border-yellow-200 dark:border-yellow-700/50"><i class="ph-fill ph-trophy mr-1"></i>Топ</span>
            </div>

            <h2 id="viewTitle" class="text-3xl md:text-5xl font-black text-gray-900 dark:text-white mb-6 leading-tight tracking-tight"></h2>
            
            <div class="flex flex-wrap items-center gap-5 text-sm text-gray-600 dark:text-gray-300 mb-8 font-semibold bg-gray-50 dark:bg-[#151718] p-5 rounded-2xl border border-gray-100 dark:border-gray-800">
                <span id="viewYearWrap" class="flex items-center gap-2"><i class="ph-bold ph-calendar-blank text-gray-400 text-xl"></i> <span id="viewYear"></span></span>
                <span id="viewDurationWrap" class="flex items-center gap-2 hidden"><i class="ph-bold ph-clock text-gray-400 text-xl"></i> <span id="viewDuration"></span></span>
                <span id="viewDirectorWrap" class="flex items-center gap-2 hidden w-full sm:w-auto mt-2 sm:mt-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-gray-200 dark:border-gray-800"><i class="ph-bold ph-video-camera text-gray-400 text-xl"></i> <span id="viewDirector" class="truncate max-w-[250px]"></span></span>
            </div>

            <div class="space-y-8 flex-grow">
                <div id="viewGenresWrap" class="hidden">
                    <p class="text-xs text-gray-400 dark:text-gray-500 uppercase tracking-widest font-bold mb-3">Жанры</p>
                    <div id="viewGenres" class="flex flex-wrap gap-2"></div>
                </div>

                <div id="viewCommentWrap" class="hidden">
                    <p class="text-xs text-gray-400 dark:text-gray-500 uppercase tracking-widest font-bold mb-3">Комментарий</p>
                    <p id="viewComment" class="text-gray-700 dark:text-gray-300 italic bg-indigo-50/50 dark:bg-indigo-900/10 p-5 rounded-2xl border border-indigo-100 dark:border-indigo-900/30 leading-relaxed text-sm"></p>
                </div>
                
                <div id="viewSeasonsWrap" class="hidden mt-6">
                    <p class="text-xs text-gray-400 dark:text-gray-500 uppercase tracking-widest font-bold mb-3 flex items-center gap-2"><i class="ph-fill ph-stack"></i> Сезоны</p>
                    <div id="viewSeasonsList" class="flex flex-col gap-2"></div>
                </div>
            </div>

            <div id="viewLinksWrap" class="hidden flex flex-col sm:flex-row gap-3 pt-8 mt-8 border-t border-gray-100 dark:border-gray-800">
                <a id="viewLink1" href="#" target="_blank" class="hidden flex-1 sm:flex-none inline-flex items-center justify-center gap-2 px-6 py-3 bg-[#f50] hover:bg-[#ff661a] text-white rounded-xl font-bold transition-all shadow-md hover:shadow-lg text-sm whitespace-nowrap min-w-[160px]"></a>
                <a id="viewLink2" href="#" target="_blank" class="hidden flex-1 sm:flex-none inline-flex items-center justify-center gap-2 px-6 py-3 bg-[#f5c518] hover:bg-[#e3b516] text-black rounded-xl font-bold transition-all shadow-md hover:shadow-lg text-sm whitespace-nowrap min-w-[160px]"></a>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно КИНО/ИГРЫ (Создание/Редакт) -->
<div id="itemModal" class="fixed inset-0 bg-gray-900/80 hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300 backdrop-blur-sm">
    <div class="bg-white dark:bg-[#1e1f22] rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden transform scale-95 transition-transform duration-300 max-h-[95vh] flex flex-col border border-gray-200 dark:border-gray-800" id="modalContent">
        
        <div class="px-6 py-5 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center bg-gray-50/50 dark:bg-[#151718] flex-shrink-0">
            <h2 class="text-xl font-black text-gray-900 dark:text-white tracking-tight" id="modalTitle">Добавить запись</h2>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors p-1 bg-white dark:bg-[#222426] rounded-full shadow-sm border border-gray-200 dark:border-gray-700">
                <i class="ph-bold ph-x text-lg"></i>
            </button>
        </div>
        
        <div class="p-6 overflow-y-auto hide-scrollbar">
            <form id="itemForm" class="space-y-6">
                <input type="hidden" id="itemId">
                
                <div>
                    <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Название *</label>
                    <div class="flex gap-2">
                        <input type="text" id="itemTitle" required class="w-full px-4 py-3 bg-gray-50 dark:bg-[#151718] border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-indigo-500 dark:text-white outline-none transition-colors font-medium">
                        <button type="button" id="magicWandBtn" onclick="autoFillData()" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300 px-4 py-3 rounded-xl font-bold transition-colors flex items-center justify-center shrink-0 w-12" title="Найти на Кинопоиске">
                            <i class="ph-bold ph-magic-wand text-xl"></i>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Тип *</label>
                        <select id="itemType" required class="w-full px-4 py-3 bg-gray-50 dark:bg-[#151718] border border-gray-200 dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-indigo-500 dark:text-white outline-none appearance-none">
                            <option value="movie">Фильм</option>
                            <option value="series">Сериал</option>
                            <option value="cartoon">Мультфильм</option>

    async function init() {
        initTheme();
        checkAdminStatus(); 
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            await signInAnonymously(auth);

            itemsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'tracker_items');
            youtubeCollection = collection(db, 'artifacts', appId, 'public', 'data', 'youtube_items');
            settingsDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'socials');

            onSnapshot(itemsCollection, (snapshot) => {
                contentData = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
                updateTotalTime();
                if(currentTab === 'main') renderGrid();
            }, (error) => console.error("Ошибка элементов:", error));
            
            onSnapshot(youtubeCollection, (snapshot) => {
                youtubeData = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
                if(currentTab === 'youtube') renderYoutubeGrid();
            }, (error) => console.error("Ошибка YouTube:", error));

            onSnapshot(settingsDocRef, (docSnap) => {
                if (docSnap.exists()) updateSocialLinksUI(docSnap.data());
            });
        } catch (error) { console.error("Ошибка Firebase:", error); }

        setupEventListeners();
        renderGenreFilterOptions();
        renderYoutubeCategorySelection();
    }

            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').classList.replace('ph-moon', 'ph-sun');

            document.documentElement.classList.remove('dark');
            document.getElementById('themeIcon').classList.replace('ph-sun', 'ph-moon');
        }
    }

    function formatTime(minutes) {
        if (!minutes || minutes <= 0) return '';
        const hours = Math.floor(minutes / 60);
        const mins = minutes % 60;
        if (hours > 0) return `${hours} ч. ${mins > 0 ? mins + ' мин.' : ''}`;
        return `${mins} мин.`;
    }

    function updateTotalTime() {
        let totalMinutes = contentData
            .filter(item => item.status === 'watched' && item.duration && !item.parentId)
            .reduce((sum, item) => sum + Number(item.duration), 0);
        const days = Math.floor(totalMinutes / (24 * 60));
        const hours = Math.floor((totalMinutes % (24 * 60)) / 60);
        const mins = totalMinutes % 60;
        document.getElementById('totalTimeDisplay').textContent = (days > 0 ? `${days} д. ` : "") + `${hours} ч. ${mins} мин.`;
    }

    function groupSeasons(data) {
        const grouped = [];
        const seasonRegex = /^(.*?)(\s+\d+\s+сезон)$/i;
        const parentMap = new Map();

        data.forEach(item => {
            const match = item.title.match(seasonRegex);
            if (match && item.type === 'series') {
                const baseName = match[1].trim();
                if (!parentMap.has(baseName)) {
                    parentMap.set(baseName, {
                        id: 'group_' + baseName,
                        title: baseName,
                        type: 'series',
                        isGroup: true,
                        children: [],
                        poster: item.poster,
                        genres: item.genres,
                        genre: item.genre,
                        year: item.year,
                        director: item.director,
                        kpUrl: item.kpUrl,
                        imdbUrl: item.imdbUrl
                    });
                    grouped.push(parentMap.get(baseName));
                }
                const parent = parentMap.get(baseName);
                item.parentId = parent.id;
                parent.children.push(item);
                
                if (item.poster) parent.poster = item.poster;
                if (!parent.year || item.year < parent.year) parent.year = item.year;
            } else {
                grouped.push(item);
            }
        });

        parentMap.forEach(parent => {
            parent.children.sort((a, b) => a.title.localeCompare(b.title));
            const activeChild = parent.children.find(c => c.status === 'watching') || parent.children[parent.children.length - 1];
            parent.status = activeChild.status;
            const ratedChildren = parent.children.filter(c => c.rating).map(c => c.rating);
            if(ratedChildren.length > 0) parent.rating = (ratedChildren.reduce((a,b)=>a+b,0) / ratedChildren.length).toFixed(1);
            parent.isTop = parent.children.some(c => c.isTop);
        });

        return grouped;
    }

        const emptyState = document.getElementById('emptyState');

        grid.innerHTML = '';

        const processedData = groupSeasons(contentData);

        let filteredData = processedData.filter(item => {
            const mSearch = item.title.toLowerCase().includes(currentFilters.search.toLowerCase());
            const mType = currentFilters.type === 'all' || item.type === currentFilters.type;
            const mStatus = currentFilters.status === 'all' || item.status === currentFilters.status;
            
            let mGenre = true;
            if (currentFilters.genre) {
                const hasInArray = item.genres && item.genres.includes(currentFilters.genre);
                const legacyLabel = ALL_GENRES[currentFilters.genre]?.label.toLowerCase() || '';
                const hasInLegacyString = item.genre && item.genre.toLowerCase().includes(legacyLabel);
                mGenre = hasInArray || hasInLegacyString;
            }
            
            const mDir = !currentFilters.director || (item.director && item.director.toLowerCase().includes(currentFilters.director.toLowerCase()));
            const mYear = !currentFilters.year || (item.year && item.year.toString() === currentFilters.year);
            
            let mBest = true;
            if (currentFilters.bestOnly) mBest = (item.rating && item.rating >= 7.5) || item.isTop === true;

            return mSearch && mType && mStatus && mGenre && mDir && mYear && mBest;
        });

        if (filteredData.length === 0) {
            grid.classList.add('hidden');
            emptyState.classList.remove('hidden');
            pagControls.classList.add('hidden');
            pagControls.classList.remove('flex');
            return;

        grid.classList.remove('hidden');
        emptyState.classList.add('hidden');

        if (currentFilters.bestOnly) filteredData.sort((a, b) => (b.rating || 0) - (a.rating || 0));

    function renderYoutubeFilters() {
        const container = document.getElementById('ytFiltersContainer');
        container.innerHTML = '';
        
        // Считаем количество
        const counts = { all: youtubeData.length, priority: 0 };
        for(let key in YT_CATEGORIES) counts[key] = 0;
        
        youtubeData.forEach(item => {
            if(item.isPriority) counts.priority++;
            if(item.category && counts[item.category] !== undefined) counts[item.category]++;
        });

        const activeClass = "bg-ytGreen text-white border-ytGreen";
        const inactiveClass = "bg-white text-gray-600 border-gray-200 hover:bg-gray-50 dark:bg-[#222426] dark:border-gray-700 dark:text-gray-300 dark:hover:bg-[#2a2c2f]";

        // Кнопка Приоритет
        const isPrioActive = ytFilters.priorityOnly;
        container.innerHTML += `
            <button onclick="toggleYtPriorityFilter()" class="px-4 py-2 rounded-full text-sm font-bold border transition-colors flex items-center gap-1.5 whitespace-nowrap shrink-0 ${isPrioActive ? activeClass : inactiveClass}">
                <i class="ph-fill ph-star ${isPrioActive ? 'text-yellow-300' : 'text-yellow-500'}"></i> Приоритет <span class="opacity-60 text-xs ml-1">${counts.priority}</span>
            </button>
        `;

        // Кнопка Все
        const isAllActive = !ytFilters.priorityOnly && ytFilters.category === 'all';
        container.innerHTML += `
            <button onclick="setYoutubeFilter('all')" class="px-4 py-2 rounded-full text-sm font-bold border transition-colors flex items-center gap-1.5 whitespace-nowrap shrink-0 ${isAllActive ? activeClass : inactiveClass}">
                Все <span class="opacity-60 text-xs ml-1">${counts.all}</span>
            </button>
        `;

        // Категории
        for (const [id, label] of Object.entries(YT_CATEGORIES)) {
            const isActive = !ytFilters.priorityOnly && ytFilters.category === id;
            container.innerHTML += `
                <button onclick="setYoutubeFilter('${id}')" class="px-4 py-2 rounded-full text-sm font-bold border transition-colors flex items-center gap-1.5 whitespace-nowrap shrink-0 ${isActive ? activeClass : inactiveClass}">
                    ${label} <span class="opacity-60 text-xs ml-1">${counts[id]}</span>
                </button>
            `;
        }
    }

    window.setYoutubeFilter = function(category) {
        ytFilters.priorityOnly = false;
        ytFilters.category = category;
        renderYoutubeFilters();
        renderYoutubeGrid();
    }

    window.toggleYtPriorityFilter = function() {
        ytFilters.priorityOnly = !ytFilters.priorityOnly;
        if(ytFilters.priorityOnly) ytFilters.category = 'all'; // сброс других фильтров
        renderYoutubeFilters();
        renderYoutubeGrid();
    }

    function renderYoutubeGrid() {
        const grid = document.getElementById('youtubeGrid');
        const emptyState = document.getElementById('youtubeEmptyState');
        grid.innerHTML = '';
        renderYoutubeFilters();

        let filteredData = youtubeData.filter(item => {
            const mSearch = item.title.toLowerCase().includes(ytFilters.search.toLowerCase()) || 
                            (item.channel && item.channel.toLowerCase().includes(ytFilters.search.toLowerCase()));
            
            let mCat = true;
            if (ytFilters.priorityOnly) {
                mCat = item.isPriority === true;
            } else if (ytFilters.category !== 'all') {
                mCat = item.category === ytFilters.category;
            }
            return mSearch && mCat;
        });
        
        filteredData.sort((a, b) => {
            let tA = a.addedAt ? a.addedAt.toMillis() : 0;
            let tB = b.addedAt ? b.addedAt.toMillis() : 0;
            return tB - tA; // Сначала новые
        });

        if (filteredData.length === 0) {
            grid.classList.add('hidden');
            emptyState.classList.remove('hidden');
            return;
        }

        grid.classList.remove('hidden');
        emptyState.classList.add('hidden');

        filteredData.forEach(item => {
            const card = document.createElement('a');
            card.href = item.url || '#';
            card.target = '_blank';
            card.className = `bg-white dark:bg-[#222426] rounded-2xl shadow-sm overflow-hidden border border-gray-100 dark:border-gray-800 card-transition flex flex-col relative group cursor-pointer block`;
            
            let adminButtons = '';
            if(isAdmin) {
                adminButtons = `
                    <button onclick="window.confirmDelete('${item.id}', 'youtube', event)" class="admin-only absolute top-2 right-2 bg-red-500/90 backdrop-blur text-white w-8 h-8 flex items-center justify-center rounded-lg sm:opacity-0 sm:group-hover:opacity-100 transition-opacity z-30 hover:bg-red-600 shadow-md">
                        <i class="ph-bold ph-trash"></i>
                    </button>
                    <button onclick="window.editYoutubeItem('${item.id}', event)" class="admin-only absolute top-2 left-2 bg-white/90 dark:bg-gray-800/90 backdrop-blur text-gray-800 dark:text-white w-8 h-8 flex items-center justify-center rounded-lg sm:opacity-0 sm:group-hover:opacity-100 transition-opacity z-30 hover:bg-white dark:hover:bg-gray-700 shadow-md">
                        <i class="ph-bold ph-pencil-simple"></i>
                    </button>
                `;
            }

        const processedData = groupSeasons(contentData);
        let filteredData = processedData.filter(item => {

            const mType = currentFilters.type === 'all' || item.type === currentFilters.type;
            const mStatus = currentFilters.status === 'all' || item.status === currentFilters.status;
            let mGenre = true;
            if (currentFilters.genre) {
                const hasInArray = item.genres && item.genres.includes(currentFilters.genre);
                mGenre = hasInArray || (item.genre && item.genre.toLowerCase().includes((ALL_GENRES[currentFilters.genre]?.label||'').toLowerCase()));
            }
            const mBest = currentFilters.bestOnly ? ((item.rating && item.rating >= 7.5) || item.isTop) : true;
            return mSearch && mType && mStatus && mGenre && mBest;
        });
        const totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE);
        if (p > totalPages) p = totalPages;
        currentPage = p;
        input.value = '';

    window.autoFillData = async function() {
        const titleInput = document.getElementById('itemTitle').value;
        if (!titleInput) { alert("Сначала введите название для поиска!"); return; }
        
        const btn = document.getElementById('magicWandBtn');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-xl"></i>';
        btn.disabled = true;

        try {
            const searchUrl = `https://kinopoiskapiunofficial.tech/api/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(titleInput)}&page=1`;
            const searchRes = await fetch(searchUrl, { headers: { 'X-API-KEY': KINOPOISK_API_KEY, 'Content-Type': 'application/json' } });
            const searchData = await searchRes.json();

            if (searchData.films && searchData.films.length > 0) {
                const film = searchData.films[0];
                document.getElementById('itemYear').value = film.year || '';
                
                if (film.filmLength) {
                    let durationStr = String(film.filmLength);
                    if (durationStr.includes(':')) {
                        const parts = durationStr.split(':');
                        const h = parseInt(parts[0]) || 0;
                        const m = parseInt(parts[1]) || 0;
                        document.getElementById('itemDuration').value = (h * 60) + m;
                    } else {
                        const durationMatch = durationStr.match(/\d+/);
                        if (durationMatch) document.getElementById('itemDuration').value = durationMatch[0];
                    }
                }
                
                if (film.posterUrl || film.posterUrlPreview) document.getElementById('itemPoster').value = film.posterUrl || film.posterUrlPreview;
                if (film.filmId) document.getElementById('itemKpUrl').value = `https://www.kinopoisk.ru/film/${film.filmId}/`;

                if (film.genres && film.genres.length > 0) {
                    selectedGenres = [];
                    film.genres.forEach(g => {
                        const kpGenre = g.genre.toLowerCase();
                        for (const [id, conf] of Object.entries(MOVIE_GENRES)) {
                            if (conf.label.toLowerCase() === kpGenre && !selectedGenres.includes(id)) {
                                selectedGenres.push(id);
                                break;
                            }
                        }
                    });
                    updateGenreSelectionUI();
                }

                if (film.filmId) {
                    try {
                        const staffUrl = `https://kinopoiskapiunofficial.tech/api/v1/staff?filmId=${film.filmId}`;
                        const staffRes = await fetch(staffUrl, { headers: { 'X-API-KEY': KINOPOISK_API_KEY, 'Content-Type': 'application/json' } });
                        const staffData = await staffRes.json();
                        const director = staffData.find(s => s.professionKey === 'DIRECTOR');
                        if (director) document.getElementById('itemDirector').value = director.nameRu || director.nameEn || '';
                    } catch (e) { console.log("Не удалось загрузить режиссера"); }
                }
            } else {
                alert("Ничего не найдено на Кинопоиске :(");
            }
        } catch (error) {
            console.error(error);
            alert("Ошибка при обращении к API Кинопоиска.");
        } finally {
            btn.innerHTML = originalHtml;
            btn.disabled = false;
        }
    };

    window.fetchYoutubeData = async function(url) {
        if(!url) return;
        const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
        const match = url.match(regExp);
        
        if (match && match[1]) {
            const videoId = match[1];
            
            const thumbUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`; 
            document.getElementById('ytThumbnailUrl').value = thumbUrl;
            
            const imgEl = document.getElementById('ytPreviewImg');
            imgEl.src = thumbUrl;
            imgEl.classList.remove('hidden');
            document.getElementById('ytPreviewPlaceholder').classList.add('hidden');
            
            imgEl.onerror = function() {
                this.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`;
                this.onerror = null;
            }

            if (!YOUTUBE_API_KEY || YOUTUBE_API_KEY === "ВСТАВЬ_СЮДА_НОВЫЙ_КЛЮЧ" || YOUTUBE_API_KEY === "") return;

            try {
                const apiUrl = `https://www.googleapis.com/youtube/v3/videos?id=${videoId}&part=snippet,contentDetails&key=${YOUTUBE_API_KEY}`;
                const res = await fetch(apiUrl);
                const data = await res.json();
                
                if(data.error) {
                    console.error("Ошибка от YouTube: " + data.error.message);
                    return;
                }

                if (data.items && data.items.length > 0) {
                    const videoInfo = data.items[0];
                    
                    document.getElementById('ytTitle').value = videoInfo.snippet.title;
                    document.getElementById('ytChannel').value = videoInfo.snippet.channelTitle;
                    
                    document.getElementById('ytAutoTitle').textContent = videoInfo.snippet.title;
                    document.getElementById('ytAutoChannel').textContent = videoInfo.snippet.channelTitle;
                    
                    const durationIso = videoInfo.contentDetails.duration;
                    const durationMatch = durationIso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
                    let durationStr = "";
                    if (durationMatch) {
                        const h = parseInt(durationMatch[1]) || 0;
                        const m = parseInt(durationMatch[2]) || 0;
                        const s = parseInt(durationMatch[3]) || 0;
                        
                        if (h > 0) durationStr += `${h}:`;
                        durationStr += `${h > 0 ? m.toString().padStart(2, '0') : m}:${s.toString().padStart(2, '0')}`;
                        document.getElementById('ytDuration').value = durationStr;
                        document.getElementById('ytAutoDuration').textContent = durationStr;
                    }
                    
                    document.getElementById('ytAutoData').classList.remove('hidden');
                    document.getElementById('ytAutoData').classList.add('flex');
                }
            } catch (error) {
                console.error("Ошибка YouTube API", error);
            }
        }
    }

        document.getElementById('itemLegacyGenre').value = item.genre || '';
        
        selectedGenres = item.genres || [];
        updateGenreSelectionUI();

        document.getElementById('modalTitle').textContent = 'Редактировать запись';
        modal.classList.remove('hidden');
        setTimeout(() => { modal.classList.remove('opacity-0'); modalContent.classList.remove('scale-95'); }, 10);
    };
    
    window.editYoutubeItem = function(id, event) {
        if (!isAdmin) return;
        if(event) { event.preventDefault(); event.stopPropagation(); }
        
        const item = youtubeData.find(i => i.id === id);
        if (!item) return;

        document.body.classList.add('modal-open');
        document.getElementById('ytItemId').value = item.id;
        document.getElementById('ytUrl').value = item.url || '';
        document.getElementById('ytTitle').value = item.title || '';
        document.getElementById('ytChannel').value = item.channel || '';
        document.getElementById('ytDuration').value = item.duration || '';
        document.getElementById('ytComment').value = item.comment || '';
        
        const isPriority = item.isPriority === true;
        document.getElementById('ytIsPriority').value = isPriority ? 'true' : 'false';
        if(isPriority) document.getElementById('ytPriorityToggle').children[0].classList.add('active');
        else document.getElementById('ytPriorityToggle').children[0].classList.remove('active');
        
        if (item.category) {
            const radio = document.querySelector(`input[name="ytCategory"][value="${item.category}"]`);
            if(radio) radio.checked = true;
        }
        
        if (item.thumbnail) {
            document.getElementById('ytThumbnailUrl').value = item.thumbnail;
            document.getElementById('ytPreviewImg').src = item.thumbnail;
            document.getElementById('ytPreviewImg').classList.remove('hidden');
            document.getElementById('ytPreviewPlaceholder').classList.add('hidden');
            
            document.getElementById('ytAutoTitle').textContent = item.title;
            document.getElementById('ytAutoChannel').textContent = item.channel;
            document.getElementById('ytAutoDuration').textContent = item.duration;
            document.getElementById('ytAutoData').classList.remove('hidden');
            document.getElementById('ytAutoData').classList.add('flex');
        }

        document.getElementById('ytModalTitle').textContent = 'Редактировать видео';
        ytModal.classList.remove('hidden');
        setTimeout(() => { ytModal.classList.remove('opacity-0'); ytModalContent.classList.remove('scale-95'); }, 10);
    }

    const confirmModal = document.getElementById('confirmModal');
    
    window.confirmDelete = function(id, type, event) {
        if (!isAdmin) return;
        if(event) { event.preventDefault(); event.stopPropagation(); }
        itemToDeleteId = id;
        itemToDeleteType = type;
        document.body.classList.add('modal-open');
        confirmModal.classList.remove('hidden');
        setTimeout(() => { confirmModal.classList.remove('opacity-0'); confirmModal.children[0].classList.remove('scale-95'); }, 10);
    }

    window.closeConfirmModal = function() {
        document.body.classList.remove('modal-open');
        confirmModal.classList.add('opacity-0');
        confirmModal.children[0].classList.add('scale-95');
        setTimeout(() => { confirmModal.classList.add('hidden'); itemToDeleteId = null; }, 200);
    }

    document.getElementById('confirmBtn').addEventListener('click', async () => {
        if (!isAdmin || !auth.currentUser || !itemToDeleteId) return;
        try {
            if(itemToDeleteType === 'youtube') {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'youtube_items', itemToDeleteId));
            } else {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tracker_items', itemToDeleteId));
            }
            closeConfirmModal();
        } catch(e) { console.error("Ошибка удаления:", e); }
    });

    function setupEventListeners() {
        document.getElementById('globalSearchInput').addEventListener('input', (e) => { 
            const val = e.target.value;
            if(currentTab === 'main') {
                currentFilters.search = val; currentPage = 1; renderGrid(); 
            } else {
                ytFilters.search = val; renderYoutubeGrid();
            }
        });
        
        document.getElementById('filterGenre').addEventListener('change', (e) => { currentFilters.genre = e.target.value; currentPage = 1; renderGrid(); });
        document.getElementById('filterDirector').addEventListener('input', (e) => { currentFilters.director = e.target.value; currentPage = 1; renderGrid(); });
        document.getElementById('filterYear').addEventListener('input', (e) => { currentFilters.year = e.target.value; currentPage = 1; renderGrid(); });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdmin || !auth.currentUser) return;

            const id = document.getElementById('itemId').value;
            const newItem = {
                title: document.getElementById('itemTitle').value,
                type: document.getElementById('itemType').value,
                status: document.getElementById('itemStatus').value,
                rating: document.getElementById('itemRating').value ? parseFloat(document.getElementById('itemRating').value) : null,
                year: document.getElementById('itemYear').value ? parseInt(document.getElementById('itemYear').value) : null,
                duration: document.getElementById('itemDuration').value ? parseInt(document.getElementById('itemDuration').value) : null,
                director: document.getElementById('itemDirector').value,
                genres: selectedGenres,
                genre: document.getElementById('itemLegacyGenre').value,
                isTop: document.getElementById('itemIsTop').checked,
                poster: document.getElementById('itemPoster').value,
                kpUrl: document.getElementById('itemKpUrl').value,
                imdbUrl: document.getElementById('itemImdbUrl').value,
                comment: document.getElementById('itemComment').value
            };

            try {
                if (id) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tracker_items', id), newItem);
                else await addDoc(itemsCollection, newItem);
                closeModal();
            } catch (error) { console.error("Ошибка сохранения:", error); }
        });
        
        ytForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isAdmin || !auth.currentUser) return;
            
            const selectedCat = document.querySelector('input[name="ytCategory"]:checked');

            const id = document.getElementById('ytItemId').value;
            const newItem = {
                url: document.getElementById('ytUrl').value,
                title: document.getElementById('ytTitle').value,
                channel: document.getElementById('ytChannel').value,
                duration: document.getElementById('ytDuration').value,
                thumbnail: document.getElementById('ytThumbnailUrl').value,
                category: selectedCat ? selectedCat.value : null,
                isPriority: document.getElementById('ytIsPriority').value === 'true',
                comment: document.getElementById('ytComment').value,
                addedAt: new Date()
            };

            try {
                if (id) {
                    delete newItem.addedAt; 
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'youtube_items', id), newItem);
                }
                else await addDoc(youtubeCollection, newItem);
                closeYoutubeModal();
            } catch (error) { console.error("Ошибка сохранения YT:", error); }
        });

        const csvInput = document.getElementById('csvFileInput');
        csvInput.addEventListener('change', function(e) {
            if (!isAdmin || !auth.currentUser) return;
            const file = e.target.files[0];
            if (!file) return;
            
            let defaultType = 'movie';
            const fileName = file.name.toLowerCase();
            if (fileName.includes('игр')) defaultType = 'game';
            if (fileName.includes('сериал')) defaultType = 'series';
            if (fileName.includes('мульт') || fileName.includes('аним')) defaultType = 'cartoon';

            const reader = new FileReader();
            reader.onload = function(event) { parseCSV(event.target.result, defaultType); csvInput.value = ''; };
            reader.readAsText(file); 
        });
    }

    async function parseCSV(csvText, defaultType) {
        const lines = csvText.split(/\r?\n/);
        if (lines.length < 2) return;
        
        let newItemsCount = 0;
        const toast = document.createElement('div');
        toast.className = 'fixed bottom-4 right-4 bg-indigo-600 text-white px-6 py-4 rounded-2xl shadow-2xl z-[100] font-bold flex items-center gap-2';
        toast.innerHTML = `<i class="ph-fill ph-spinner animate-spin text-xl"></i> Анализируем файл...`;
        document.body.appendChild(toast);

        const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, '').toLowerCase());
        let titleIndex = headers.findIndex(h => h.includes('название') || h.includes('title'));
        let fallbackTitleIndex = 1;
        let statusIndex = headers.findIndex(h => h.includes('статус'));
        let yearIndex = headers.findIndex(h => h.includes('дата') || h.includes('выход'));
        let ratingIndex = headers.findIndex(h => h.includes('моя оценка'));
        let commentIndex = headers.findIndex(h => h.includes('примечание') || h.includes('комментарий'));
        let genreIndex = headers.findIndex(h => h.includes('жанр'));

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const values = []; let inQuotes = false; let currentVal = '';
            for (let char of lines[i]) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { values.push(currentVal.trim()); currentVal = ''; }
                else currentVal += char;
            }
            values.push(currentVal.trim()); 

            let title = titleIndex !== -1 && values[titleIndex] ? values[titleIndex].replace(/^"|"$/g, '') : null;
            if (!title || title.trim() === '') {
                if(values.length > fallbackTitleIndex && values[fallbackTitleIndex].trim() !== '') title = values[fallbackTitleIndex].replace(/^"|"$/g, '');
                else continue;
            }

            let rawStatus = statusIndex !== -1 && values[statusIndex] ? values[statusIndex].replace(/^"|"$/g, '').toLowerCase() : '';
            let itemStatus = 'planning';
            if (rawStatus.includes('смотрел') || rawStatus.includes('прошёл') || rawStatus.includes('прошел')) itemStatus = 'watched';
            if (rawStatus.includes('не смотрел') || rawStatus.includes('в планах')) itemStatus = 'planning';
            if (rawStatus.includes('процесс') || rawStatus.includes('смотрю') || rawStatus.includes('играю')) itemStatus = 'watching';
            if (rawStatus.includes('брошен') || rawStatus.includes('дроп')) itemStatus = 'dropped';

            let rawYear = yearIndex !== -1 && values[yearIndex] ? values[yearIndex].replace(/^"|"$/g, '') : '';
            let year = parseInt(rawYear); year = isNaN(year) ? null : year;

            let rawRating = ratingIndex !== -1 && values[ratingIndex] ? values[ratingIndex].replace(/^"|"$/g, '') : '';
            let rating = null;
            const ratingMatch = rawRating.match(/\d+(\.\d+)?/);
            if (ratingMatch) {
                let num = parseFloat(ratingMatch[0]);
                if (!isNaN(num) && num > 0 && num <= 10) rating = num;
                if (rawRating.includes('золото') && ratingMatch[0] === '1') rating = 10;
            }

            let comment = commentIndex !== -1 && values[commentIndex] ? values[commentIndex].replace(/^"|"$/g, '') : '';
            let legacyGenre = genreIndex !== -1 && values[genreIndex] ? values[genreIndex].replace(/^"|"$/g, '') : '';

            const newItem = { title, type: defaultType, status: itemStatus, rating, year, duration: null, director: '', genres: [], genre: legacyGenre, isTop: false, poster: '', comment };
            try { await addDoc(itemsCollection, newItem); newItemsCount++; } catch(e) { console.error("Ошибка:", e); }
        }

        toast.className = 'fixed bottom-4 right-4 bg-green-500 text-white px-6 py-4 rounded-2xl shadow-2xl transition-opacity duration-300 z-[100] font-bold flex items-center gap-2';
        toast.innerHTML = `<i class="ph-bold ph-check-circle text-xl"></i> Загружено записей: ${newItemsCount}`;
        setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 4000);
    }

    init();
</script>
